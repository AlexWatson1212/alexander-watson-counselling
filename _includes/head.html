<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <script>
    document.documentElement.classList.add('js');
  </script>

  <title>
    {% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}
  </title>

  <meta
    name="description"
    content="{{ page.description | default: site.description | strip_html | strip_newlines | escape }}"
  >

  <meta name="theme-color" content="#fffdf9">

  <link
    rel="canonical"
    href="{{ page.url | absolute_url }}"
  >

  {% if page.noindex %}
  <meta name="robots" content="noindex, nofollow">
  {% endif %}

  <!-- Favicons -->
  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="{{ '/assets/images/brand/favicon-32x32.png' | relative_url }}"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="16x16"
    href="{{ '/assets/images/brand/favicon-16x16.png' | relative_url }}"
  >

  <link
    rel="shortcut icon"
    type="image/x-icon"
    href="{{ '/assets/images/brand/favicon.ico' | relative_url }}"
  >

  <!-- Open Graph -->
  <meta
    property="og:title"
    content="{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}"
  >

  <meta
    property="og:description"
    content="{{ page.description | default: site.description | strip_html | strip_newlines | escape }}"
  >

  <meta property="og:type" content="website">

  <meta
    property="og:url"
    content="{{ page.url | absolute_url }}"
  >

  <meta
    property="og:site_name"
    content="{{ site.title }}"
  >

  {% if page.social_image %}
  <meta
    property="og:image"
    content="{{ page.social_image | absolute_url }}"
  >
  {% endif %}

  <!-- Homepage hero preload -->
  {% if page.url == '/' %}
  <link
    rel="preload"
    as="image"
    href="{{ '/assets/images/home/home-hero-winding-path-landscape.webp' | relative_url }}"
    fetchpriority="high"
  >
  {% endif %}

  <!-- Fonts -->
  {% if site.use_google_fonts %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600&display=swap"
    rel="stylesheet"
  >
  {% endif %}

  <link
    rel="stylesheet"
    href="{{ '/assets/css/main.css' | relative_url }}"
  >
</head>
