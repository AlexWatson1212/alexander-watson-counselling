<header class="site-header">
  <div class="shell header-inner">
    <a
      class="brand"
      href="{{ '/' | relative_url }}"
      aria-label="Alexander Watson Counselling — Home">
      <span>Alexander Watson</span>
      <small>Counselling</small>
    </a>

    <button
      class="menu-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="site-navigation"
      aria-label="Open primary navigation"
      data-menu-toggle>
      <span class="menu-label" data-menu-label>Menu</span>
      <span class="menu-icon" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </button>

    <nav
      id="site-navigation"
      class="site-nav"
      aria-label="Primary navigation"
      data-site-navigation>
      <ul class="nav-list">
        {% assign navigation_items = site.data.navigation %}
        {% for item in navigation_items %}
        <li>
          <a
            href="{{ item.url | relative_url }}"
            {% if page.url == item.url %}aria-current="page"{% endif %}>
            {{ item.label }}
          </a>
        </li>
        {% endfor %}
      </ul>

      <div class="nav-actions">
        <a class="nav-cta" href="{{ '/contact/' | relative_url }}">
          Begin a conversation
        </a>
        <p class="nav-location">Greater Manchester · Online</p>
      </div>
    </nav>
  </div>
</header>
