<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
      <span>Alexander Watson</span><small>Counselling</small>
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-navigation"><span>Menu</span></button>
    <nav id="site-navigation" class="site-nav" aria-label="Primary navigation">
      <ul>
        {% for item in site.data.navigation %}
        <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.label }}</a></li>
        {% endfor %}
      </ul>
      <a class="nav-cta" href="{{ '/contact/' | relative_url }}">Begin a conversation</a>
    </nav>
  </div>
</header>
